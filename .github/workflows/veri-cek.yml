name: Veri cek

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Eski veriyi sakla
        run: |
          cp data/trend.json /tmp/eski-trend.json 2>/dev/null || true
          cp data/akis.json /tmp/eski-akis.json 2>/dev/null || true

      - name: Trend videolari cek
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p data
          node -e '
          const key = process.env.YOUTUBE_API_KEY;
          const sn = d => { const m = (d || "").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); return m ? (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)) : 0; };
          const url = "https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&chart=mostPopular&regionCode=TR&maxResults=50&key=" + key;
          fetch(url).then(r => r.json()).then(j => {
            if (j.error) { console.error(j.error.message); process.exit(1); }
            const videolar = j.items.map(v => ({
              id: v.id,
              baslik: v.snippet.title,
              kanal: v.snippet.channelTitle,
              kanalId: v.snippet.channelId,
              tarih: v.snippet.publishedAt,
              resim: (v.snippet.thumbnails.medium || v.snippet.thumbnails.default).url,
              izlenme: Number(v.statistics?.viewCount || 0),
              sure: sn(v.contentDetails?.duration),
              canli: v.snippet.liveBroadcastContent === "live"
            }));
            require("fs").writeFileSync("data/trend.json", JSON.stringify({ guncelleme: new Date().toISOString(), videolar }, null, 2));
            console.log(videolar.length + " trend video kaydedildi");
          });
          '

      - name: Kanal videolarini cek
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node -e '
          const key = process.env.YOUTUBE_API_KEY;
          const fs = require("fs");
          const sn = d => { const m = (d || "").match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); return m ? (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)) : 0; };
          const kanallar = JSON.parse(fs.readFileSync("data/kanallar.json", "utf8")).filter(k => k.id);
          const api = async (yol) => {
            const j = await (await fetch("https://www.googleapis.com/youtube/v3/" + yol + "&key=" + key)).json();
            if (j.error) throw new Error(j.error.message);
            return j;
          };
          (async () => {
            const kategoriBul = {};
            const idler = [];
            for (const k of kanallar) {
              kategoriBul[k.id] = k.kategori;
              try {
                const j = await api("playlistItems?part=contentDetails&maxResults=5&playlistId=UU" + k.id.slice(2));
                j.items.forEach(x => idler.push(x.contentDetails.videoId));
              } catch (e) { console.log(k.ad + ": " + e.message); }
            }
            const videolar = [];
            for (let i = 0; i < idler.length; i += 50) {
              const j = await api("videos?part=snippet,statistics,liveStreamingDetails,contentDetails&id=" + idler.slice(i, i + 50).join(","));
              j.items.forEach(v => videolar.push({
                id: v.id,
                baslik: v.snippet.title,
                kanal: v.snippet.channelTitle,
                kanalId: v.snippet.channelId,
                kategori: kategoriBul[v.snippet.channelId] || "",
                tarih: v.snippet.publishedAt,
                resim: (v.snippet.thumbnails.medium || v.snippet.thumbnails.default).url,
                izlenme: Number(v.statistics?.viewCount || 0),
                izleyen: Number(v.liveStreamingDetails?.concurrentViewers || 0),
                planlanan: v.liveStreamingDetails?.scheduledStartTime || null,
                sure: sn(v.contentDetails?.duration),
                durum: v.snippet.liveBroadcastContent
              }));
            }
            videolar.sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
            fs.writeFileSync("data/akis.json", JSON.stringify({ guncelleme: new Date().toISOString(), videolar }, null, 2));
            console.log(videolar.length + " kanal videosu, " + videolar.filter(v => v.durum === "live").length + " canli, " + videolar.filter(v => v.durum === "upcoming").length + " planli yayin");
          })().catch(e => { console.error(e.message); process.exit(1); });
          '

      - name: YouTube gundemini uret
        run: node gundem-yap.js

      - name: Kaydet
        run: |
          git config user.name "ne-var-bot"
          git config user.email "actions@github.com"
          git add data/trend.json data/akis.json data/gundem.json
          git diff --staged --quiet || git commit -m "Veriler guncellendi"
          git pull --rebase
          git push
