name: Kanal eslestir

on:
  workflow_dispatch:
  push:
    paths:
      - kanal-listesi.txt

permissions:
  contents: write

jobs:
  eslestir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kanallari bul
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p data
          node -e '
          const key = process.env.YOUTUBE_API_KEY;
          const fs = require("fs");
          const api = async (yol) => {
            const j = await (await fetch("https://www.googleapis.com/youtube/v3/" + yol + "&key=" + key)).json();
            if (j.error) throw new Error(j.error.message);
            return j;
          };
          const satirlar = fs.readFileSync("kanal-listesi.txt", "utf8").split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#"));
          (async () => {
            const sonuc = [];
            for (const satir of satirlar) {
              const [kategori, ad, kimlikHam] = satir.split("|").map(x => (x || "").trim());
              const kimlik = kimlikHam || "";
              let id = null, bulunan = null, abone = 0, yontem = "";
              if (kimlik) {
                const yol = kimlik.startsWith("UC") ? "id=" + kimlik : "forHandle=" + encodeURIComponent(kimlik.startsWith("@") ? kimlik : "@" + kimlik);
                const j = await api("channels?part=snippet,statistics&" + yol);
                const k = j.items && j.items[0];
                if (k) { id = k.id; bulunan = k.snippet.title; abone = Number(k.statistics.subscriberCount || 0); }
                yontem = "kimlik";
              } else {
                const j = await api("search?part=snippet&type=channel&maxResults=1&regionCode=TR&relevanceLanguage=tr&q=" + encodeURIComponent(ad));
                const k = j.items && j.items[0];
                if (k) { id = k.snippet.channelId; bulunan = k.snippet.channelTitle; }
                yontem = "arama";
              }
              sonuc.push({ kategori, ad, kimlik, id, bulunan, abone, yontem });
            }
            fs.writeFileSync("data/kanallar.json", JSON.stringify(sonuc, null, 2));
            sonuc.forEach(s => console.log((s.id ? (s.yontem === "arama" ? "KONTROL ET  " : "OK          ") : "YOK         ") + s.ad + "  ->  " + (s.bulunan || "-") + "  (" + s.abone + " abone)"));
            const yok = sonuc.filter(s => !s.id);
            const kontrol = sonuc.filter(s => s.id && s.yontem === "arama");
            console.log("");
            console.log("Toplam: " + sonuc.length + " kanal | bulunamayan: " + yok.length + " | aramayla bulunan (kontrol et): " + kontrol.length);
            if (yok.length) console.log("Bulunamayanlar: " + yok.map(s => s.ad).join(", "));
            if (kontrol.length) console.log("Kontrol edilecekler: " + kontrol.map(s => s.ad + " -> " + s.bulunan).join(", "));
          })().catch(e => { console.error(e.message); process.exit(1); });
          '

      - name: Kaydet
        run: |
          git config user.name "ne-var-bot"
          git config user.email "actions@github.com"
          git add data/kanallar.json
          git diff --staged --quiet || git commit -m "Kanal eslesmeleri"
          git pull --rebase
          git push
