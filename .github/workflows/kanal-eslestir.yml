name: Kanal eslestir

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eslestir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kanallari bul
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p data
          node -e '
          const key = process.env.YOUTUBE_API_KEY;
          const liste = [
            ["Gündem ve Haber","Cüneyt Özdemir","@cuneytozdemir"],["Gündem ve Haber","Fatih Altaylı","@fatihaltayli"],
            ["Gündem ve Haber","Nevşin Mengü","@nevsinmengutv"],["Gündem ve Haber","Medyascope","@medyascope_tv"],
            ["Gündem ve Haber","BBC News Türkçe","@bbcnewsturkce"],["Gündem ve Haber","DW Türkçe","@dwturkce"],
            ["Gündem ve Haber","Sözcü TV","@sozcutelevizyonu"],["Gündem ve Haber","Halk TV","@halktv-eu"],
            ["Gündem ve Haber","Tele1","@tele1comtr"],["Gündem ve Haber","TRT Haber","@trthaber"],
            ["Gündem ve Haber","CNN TÜRK","@cnnturk"],["Gündem ve Haber","NTV","@ntv"],
            ["Gündem ve Haber","Habertürk","@haberturktv"],["Gündem ve Haber","A Haber","@ahaber"],
            ["Bilgi ve Belgesel","Ruhi Çenet","@ruhicenetdocs"],["Bilgi ve Belgesel","Barış Özcan","@barisozcan"],
            ["Bilgi ve Belgesel","Evrim Ağacı","@evrimagaci"],["Bilgi ve Belgesel","Anlatan Adamlar","@AnlatanAdamlar"],
            ["Bilgi ve Belgesel","TRT Belgesel","@trtbelgesel"],
            ["Spor","Vole","@voleapp"],["Spor","beIN SPORTS Türkiye","@beinsportsturkiye"],["Spor","TRT Spor","@trtspor"],
            ["Spor","Socrates Dergi","@socratesdergi"],["Spor","Rabona Digital","@rabonadigital"],["Spor","Galatasaray","@galatasaray"],
            ["Spor","Fenerbahçe SK","@fenerbahce"],["Spor","Beşiktaş JK","@besiktas"],["Spor","Trabzonspor","@trabzonspor"],
            ["Eğlence ve Tepki","Orkun Işıtmak","@orkunisitmak"],["Eğlence ve Tepki","Tepkikolik","@tepkikolik"],
            ["Eğlence ve Tepki","Noluyo Ya","@noluyoyaa"],["Eğlence ve Tepki","Hayrettin","@hayrettin"],
            ["Eğlence ve Tepki","Enes Batur","@newdaynewgame"],["Eğlence ve Tepki","Hayalhanem","@hayalhanem"],
            ["Eğlence ve Tepki","Danla Bilic","@danlabilic"],["Eğlence ve Tepki","Onedio","@onediotube"],
            ["Sohbet ve Podcast","Kafa TV","@kafa"],["Sohbet ve Podcast","Mantra","@mantrast"],
            ["Sohbet ve Podcast","Babala TV","@babalatv"],["Sohbet ve Podcast","Az Önce Konuştum","@candastolgaileazoncekonustum"],
            ["Sohbet ve Podcast","Fularsız Entellik","@fularszentellik"],["Sohbet ve Podcast","Saba Tümer","@sabatumer"],
            ["Aile ve Vlog","Atik Ailesi","@atikailesi"],["Aile ve Vlog","Duygu Özaslan","@duyguozaslan"],
            ["Aile ve Vlog","Merve Özkaynak","@merveozkaynak"]
          ];
          (async () => {
            const sonuc = [];
            for (const [kategori, ad, tutamak] of liste) {
              const j = await (await fetch("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=" + encodeURIComponent(tutamak) + "&key=" + key)).json();
              if (j.error) { console.error(ad + ": " + j.error.message); process.exit(1); }
              const k = j.items && j.items[0];
              sonuc.push({
                kategori, ad, tutamak,
                id: k ? k.id : null,
                bulunan: k ? k.snippet.title : null,
                abone: k ? Number(k.statistics.subscriberCount || 0) : 0
              });
            }
            require("fs").writeFileSync("data/kanallar.json", JSON.stringify(sonuc, null, 2));
            console.log(sonuc.map(s => (s.id ? "OK   " : "YOK  ") + s.ad + "  ->  " + s.bulunan + "  " + s.tutamak + "  (" + s.abone + " abone)").join("\n"));
            const eksik = sonuc.filter(s => !s.id).length;
            console.log("\nToplam: " + sonuc.length + " kanal, bulunamayan: " + eksik);
          })();
          '

      - name: Kaydet
        run: |
          git config user.name "ne-var-bot"
          git config user.email "actions@github.com"
          git add data/kanallar.json
          git diff --staged --quiet || git commit -m "Kanal eslesmeleri"
          git pull --rebase
          git push
