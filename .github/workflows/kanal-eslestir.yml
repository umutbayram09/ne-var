name: Kanal eslestir

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eslestir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kanallari bul
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p data
          node -e '
          const key = process.env.YOUTUBE_API_KEY;
          const liste = [
            ["Gündem ve Haber","Cüneyt Özdemir"],["Gündem ve Haber","Fatih Altaylı"],["Gündem ve Haber","Nevşin Mengü"],
            ["Gündem ve Haber","Medyascope"],["Gündem ve Haber","BBC News Türkçe"],["Gündem ve Haber","DW Türkçe"],
            ["Gündem ve Haber","Sözcü TV"],["Gündem ve Haber","Halk TV"],["Gündem ve Haber","Tele1"],
            ["Gündem ve Haber","TRT Haber"],["Gündem ve Haber","CNN TÜRK"],["Gündem ve Haber","NTV"],
            ["Gündem ve Haber","Habertürk"],["Gündem ve Haber","A Haber"],
            ["Bilgi ve Belgesel","Ruhi Çenet","@ruhicenet"],["Bilgi ve Belgesel","Barış Özcan"],["Bilgi ve Belgesel","Evrim Ağacı"],
            ["Bilgi ve Belgesel","Anlatan Adam"],["Bilgi ve Belgesel","TRT Belgesel"],["Bilgi ve Belgesel","Ekşi Şeyler","@eksiseyler"],
            ["Spor","Vole"],["Spor","beIN SPORTS Türkiye"],["Spor","TRT Spor"],["Spor","Socrates Dergi"],
            ["Spor","Rabona Digital"],["Spor","Galatasaray"],["Spor","Fenerbahçe SK"],["Spor","Beşiktaş JK"],["Spor","Trabzonspor","@trabzonspor"],
            ["Eğlence ve Tepki","Orkun Işıtmak"],["Eğlence ve Tepki","Tepkikolik"],["Eğlence ve Tepki","Noluyo Ya"],
            ["Eğlence ve Tepki","Hayrettin"],["Eğlence ve Tepki","Enes Batur"],["Eğlence ve Tepki","Reynmen","@reynmen"],
            ["Eğlence ve Tepki","Hayalhanem"],["Eğlence ve Tepki","Danla Bilic"],["Eğlence ve Tepki","Onedio"],
            ["Sohbet ve Podcast","Kafa TV"],["Sohbet ve Podcast","Mantra"],["Sohbet ve Podcast","Babala TV"],
            ["Sohbet ve Podcast","Az Önce Konuştum"],["Sohbet ve Podcast","Fularsız Entellik"],["Sohbet ve Podcast","Saba Tümer"],
            ["Aile ve Vlog","Atik Ailesi"],["Aile ve Vlog","Duygu Özaslan"],["Aile ve Vlog","Merve Özkaynak"]
          ];
          (async () => {
            const sonuc = [];
            for (const [kategori, ad, tutamakVer] of liste) {
              let id = null, bulunan = null;
              if (tutamakVer) {
                const j = await (await fetch("https://www.googleapis.com/youtube/v3/channels?part=snippet&forHandle=" + encodeURIComponent(tutamakVer) + "&key=" + key)).json();
                if (j.error) { console.error(ad + ": " + j.error.message); process.exit(1); }
                const k = j.items && j.items[0];
                if (k) { id = k.id; bulunan = k.snippet.title; }
              } else {
                const u = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&maxResults=1&regionCode=TR&relevanceLanguage=tr&q=" + encodeURIComponent(ad) + "&key=" + key;
                const j = await (await fetch(u)).json();
                if (j.error) { console.error(ad + ": " + j.error.message); process.exit(1); }
                const k = j.items && j.items[0];
                if (k) { id = k.snippet.channelId; bulunan = k.snippet.channelTitle; }
              }
              sonuc.push({ kategori, ad, id, bulunan });
            }
            const idler = sonuc.filter(s => s.id).map(s => s.id);
            const c = await (await fetch("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=" + idler.join(",") + "&key=" + key)).json();
            const bilgi = {};
            (c.items || []).forEach(x => { bilgi[x.id] = { tutamak: x.snippet.customUrl || "", abone: Number(x.statistics.subscriberCount || 0) }; });
            sonuc.forEach(s => Object.assign(s, bilgi[s.id] || {}));
            require("fs").writeFileSync("data/kanallar.json", JSON.stringify(sonuc, null, 2));
            console.log(sonuc.map(s => s.ad + "  ->  " + s.bulunan + "  " + (s.tutamak || "") + "  (" + (s.abone || 0) + " abone)").join("\n"));
          })();
          '

      - name: Kaydet
        run: |
          git config user.name "ne-var-bot"
          git config user.email "actions@github.com"
          git add data/kanallar.json
          git diff --staged --quiet || git commit -m "Kanal eslesmeleri"
          git pull --rebase
          git push
