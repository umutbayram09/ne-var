<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f12">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>Ne Var? – Şimdi YouTube'da ne var</title>
<style>
  :root { --bg:#0f0f12; --kart:#1b1b21; --kart2:#2a2a33; --yazi:#f2f2f2; --soluk:#9a9aa5; --vurgu:#ff3b5c; --mavi:#3b82f6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  body { background:var(--bg); color:var(--yazi); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; background:var(--bg); padding:16px 16px 0; z-index:10; }
  .ust { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:22px; }
  h1 span { color:var(--vurgu); }
  .guncelleme { color:var(--soluk); font-size:12px; }
  .araclar { display:flex; gap:12px; align-items:center; margin-top:12px; }
  #arama { flex:1; min-width:0; background:var(--kart); border:1px solid var(--kart2); color:var(--yazi); border-radius:999px; padding:9px 14px; font-size:14px; outline:none; }
  #arama:focus { border-color:var(--vurgu); }
  .secim { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--soluk); white-space:nowrap; cursor:pointer; }
  .secim input { accent-color:var(--vurgu); width:16px; height:16px; }
  nav { display:flex; gap:8px; overflow-x:auto; padding:12px 0; scrollbar-width:none; }
  nav button { flex:none; border:0; border-radius:999px; padding:8px 14px; background:var(--kart); color:var(--yazi); font-size:14px; cursor:pointer; }
  nav button.aktif { background:var(--vurgu); }
  nav.alt { padding:0 0 12px; }
  nav.alt button { font-size:13px; padding:6px 12px; }
  main { padding:8px 16px 32px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .kart { position:relative; background:var(--kart); border-radius:12px; }
  .kart a { display:flex; gap:12px; padding:10px 40px 10px 10px; color:inherit; text-decoration:none; }
  .kart img { width:140px; aspect-ratio:16/9; object-fit:cover; border-radius:8px; flex:none; background:var(--kart2); }
  .yildiz { position:absolute; top:6px; right:6px; border:0; background:none; color:var(--soluk); font-size:20px; line-height:1; padding:4px; cursor:pointer; }
  .yildiz.dolu { color:#ffc53d; }
  .bilgi { min-width:0; display:flex; flex-direction:column; gap:4px; }
  .baslik { font-size:14px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kanal, .detay { font-size:12px; color:var(--soluk); }
  .sira { color:var(--vurgu); font-weight:700; }
  .rozet { color:#fff; background:#e5162b; border-radius:4px; padding:1px 6px; font-size:11px; font-weight:700; margin-right:4px; }
  .rozet.planli { background:var(--mavi); }
  .yer { width:140px; aspect-ratio:16/9; border-radius:8px; flex:none; background:var(--kart2); display:flex; align-items:center; justify-content:center; font-size:28px; }
  .ozet { font-size:12px; color:var(--soluk); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kart.haber a { padding-right:10px; }
  .zar { border:0; border-radius:999px; padding:9px 14px; background:var(--kart2); color:var(--yazi); font-size:14px; cursor:pointer; white-space:nowrap; }
  .takvim { display:flex; flex-wrap:wrap; gap:8px; padding:0 10px 10px 162px; }
  .takvim a { font-size:12px; color:#8ab4ff; text-decoration:none; background:var(--kart2); padding:4px 8px; border-radius:6px; }
  .perde { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; }
  .pencere { background:var(--kart); border-radius:16px; padding:20px; max-width:560px; width:100%; max-height:90vh; overflow:auto; }
  .pencere h2 { font-size:20px; margin-bottom:6px; }
  .pencere p { color:var(--soluk); font-size:14px; line-height:1.4; margin-bottom:14px; }
  .secenekler { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .secenekler button { border:1px solid var(--kart2); background:var(--bg); color:var(--yazi); border-radius:999px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .secenekler button.secili { background:var(--vurgu); border-color:var(--vurgu); }
  .dugmeler { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  .ana-dugme { border:0; border-radius:999px; padding:10px 18px; background:var(--vurgu); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .ikincil { border:0; background:none; color:var(--soluk); font-size:14px; cursor:pointer; padding:8px 10px; }
  .bolum { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:6px; font-size:16px; font-weight:700; }
  .bolum .alt-yazi { font-size:12px; font-weight:400; color:var(--soluk); }
  .bolum button { border:0; border-radius:999px; padding:7px 12px; background:var(--kart2); color:var(--yazi); font-size:13px; cursor:pointer; }
  .bos { color:var(--soluk); padding:32px 0; grid-column:1/-1; text-align:center; line-height:1.5; }
  footer { text-align:center; color:var(--soluk); font-size:11px; padding:0 16px 24px; }
</style>
</head>
<body>
<header>
  <div class="ust">
    <h1>Ne <span>Var?</span></h1>
    <div class="guncelleme" id="guncelleme">Yükleniyor…</div>
  </div>
  <div class="araclar">
    <input id="arama" type="search" placeholder="Kanal ya da video ara…" autocomplete="off">
    <button id="zarButon" class="zar">🎲 Ne izlesem?</button>
    <label class="secim"><input type="checkbox" id="shorts"> Shorts gizle</label>
  </div>
  <nav id="sekmeler">
    <button data-sekme="ozel">✨ Sana Özel</button>
    <button data-sekme="trend" class="aktif">🔥 Trend</button>
    <button data-sekme="canli" id="canliButon">🔴 Canlı</button>
    <button data-sekme="yaklasan" id="yaklasanButon">📅 Yaklaşan</button>
    <button data-sekme="yeni">🆕 Yeni</button>
    <button data-sekme="gundem">📣 YouTube Gündemi</button>
    <button data-sekme="favori">⭐ Favorilerim</button>
    <button data-sekme="kategori">📂 Kategoriler</button>
  </nav>
  <nav id="kategoriler" class="alt" hidden></nav>
  <nav id="konular" class="alt" hidden></nav>
</header>
<main id="liste"></main>
<footer>Video verileri YouTube Data API ile alınmaktadır. Gündem cümleleri bu verilerden otomatik üretilir. Basında çıkan haberler kaynak sitelerin RSS akışlarından gelir ve kendi sitelerinde açılır. Bu site YouTube ile bağlantılı değildir.</footer>
<script>
const KATEGORILER = ["Gündem ve Haber", "Spor", "Eğlence ve Tepki", "Oyun", "Müzik", "Komedi ve Skeç", "Sohbet ve Podcast", "Bilgi ve Belgesel", "Teknoloji", "Yemek", "Eğitim", "Otomobil", "Gezi", "Güzellik ve Moda", "Aile ve Vlog"];
const KATEGORI_SIMGE = { "Gündem ve Haber": "📰", "Spor": "⚽", "Eğlence ve Tepki": "😂", "Oyun": "🎮", "Müzik": "🎵", "Komedi ve Skeç": "🎭", "Sohbet ve Podcast": "🎙️", "Bilgi ve Belgesel": "🧠", "Teknoloji": "💻", "Yemek": "🍳", "Eğitim": "📚", "Otomobil": "🚗", "Gezi": "✈️", "Güzellik ve Moda": "💄", "Aile ve Vlog": "🏡" };
const GUNDEM_TUR = { trend: ["🔥", "Trend"], zirve: ["👑", "Trend"], canli: ["🔴", "Canlı"], plan: ["📅", "Planlanan"], esik: ["🚀", "Rekor"], basin: ["📰", "Basında"] };
const GUNDEM_FILTRE = ["Tümü", "Trend", "Canlı", "Planlanan", "Rekor", "Basında"];
const GUNLER = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
const BES_DK = 5 * 60 * 1000;
let trend = [], akis = [], gundem = [], sekme = "trend", secilenKategori = KATEGORILER[0], secilenKonu = "Tümü";
let aranan = "", arananHam = "", guncellemeZamani = null, sonYukleme = 0;

function oku(ad, varsayilan) {
  try { const d = localStorage.getItem(ad); return d === null ? varsayilan : JSON.parse(d); } catch (e) { return varsayilan; }
}
function kaydet(ad, deger) {
  try { localStorage.setItem(ad, JSON.stringify(deger)); } catch (e) {}
}
const favoriler = new Set(oku("favoriler", []));
let shortsGizle = oku("shortsGizle", true);
let ilgiler = oku("ilgiler", null);
let oneriSecim = [];
if (ilgiler && ilgiler.length) sekme = "ozel";

function neZaman(t) {
  const dk = Math.floor((Date.now() - new Date(t)) / 60000);
  if (dk < 1) return "az önce";
  if (dk < 60) return dk + " dk önce";
  const sa = Math.floor(dk / 60);
  if (sa < 24) return sa + " saat önce";
  return Math.floor(sa / 24) + " gün önce";
}
function saatYaz(t) {
  const d = new Date(t);
  const saat = d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  const gunFark = Math.round((new Date(d.toDateString()) - new Date(new Date().toDateString())) / 86400000);
  if (gunFark <= 0) return "Bugün " + saat;
  if (gunFark === 1) return "Yarın " + saat;
  if (gunFark < 7) return GUNLER[d.getDay()] + " " + saat;
  return d.toLocaleDateString("tr-TR", { day: "numeric", month: "short" }) + " " + saat;
}
function sayi(n) {
  return new Intl.NumberFormat("tr-TR", { notation: "compact" }).format(n);
}
function shortsMu(v) {
  return (v.sure > 0 && v.sure <= 60) || /#shorts?\b/i.test(v.baslik);
}
function yap(etiket, sinif, yazi) {
  const e = document.createElement(etiket);
  if (sinif) e.className = sinif;
  if (yazi) e.textContent = yazi;
  return e;
}

function kart(v, siraGoster) {
  const kutu = yap("div", "kart");
  const a = yap("a");
  a.href = "https://www.youtube.com/watch?v=" + v.id;
  a.target = "_blank";
  a.rel = "noopener";
  const img = yap("img");
  img.src = v.resim;
  img.alt = "";
  img.loading = "lazy";
  const baslik = yap("div", "baslik");
  if (siraGoster && v.sira) baslik.append(yap("span", "sira", v.sira + ". "));
  baslik.append(v.baslik);
  const detay = yap("div", "detay");
  if (v.durum === "live" || v.canli) {
    detay.append(yap("span", "rozet", "CANLI"), v.izleyen ? sayi(v.izleyen) + " kişi izliyor" : "Şu an yayında");
  } else if (v.durum === "upcoming") {
    detay.append(yap("span", "rozet planli", "PLANLI"), saatYaz(v.planlanan || v.tarih));
  } else {
    detay.append(sayi(v.izlenme) + " izlenme · " + neZaman(v.tarih));
  }
  const bilgi = yap("div", "bilgi");
  bilgi.append(baslik, yap("div", "kanal", v.kanal), detay);
  a.append(img, bilgi);

  const favori = favoriler.has(v.kanalId);
  const yildiz = yap("button", "yildiz" + (favori ? " dolu" : ""), favori ? "★" : "☆");
  yildiz.title = favori ? "Favorilerden çıkar" : "Kanalı favorilere ekle";
  yildiz.setAttribute("aria-label", yildiz.title);
  yildiz.onclick = () => {
    if (favoriler.has(v.kanalId)) favoriler.delete(v.kanalId); else favoriler.add(v.kanalId);
    kaydet("favoriler", [...favoriler]);
    goster();
  };
  kutu.append(a);
  if (v.durum === "upcoming") kutu.append(takvimBaglantilari(v));
  kutu.append(yildiz);
  return kutu;
}

function takvimBaglantilari(v) {
  const bas = new Date(v.planlanan || v.tarih);
  const bit = new Date(bas.getTime() + 3600000);
  const f = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const url = "https://www.youtube.com/watch?v=" + v.id;
  const ad = v.kanal + ": " + v.baslik;
  const g = yap("a", "", "📅 Google Takvim");
  g.href = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(ad) + "&dates=" + f(bas) + "/" + f(bit) + "&details=" + encodeURIComponent("Ne Var? hatırlatması\n" + url);
  g.target = "_blank";
  g.rel = "noopener";
  const i = yap("a", "", "🗓️ Telefon takvimi");
  i.href = "#";
  i.onclick = e => {
    e.preventDefault();
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//NeVar//TR", "BEGIN:VEVENT", "UID:" + v.id + "@ne-var", "DTSTAMP:" + f(new Date()), "DTSTART:" + f(bas), "DTEND:" + f(bit),
      "SUMMARY:" + ad.replace(/[,;\\\n]/g, " "), "DESCRIPTION:" + url, "URL:" + url,
      "BEGIN:VALARM", "TRIGGER:-PT10M", "ACTION:DISPLAY", "DESCRIPTION:Yayın 10 dakika sonra başlıyor", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    const l = document.createElement("a");
    l.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
    l.download = "ne-var-yayin.ics";
    document.body.append(l);
    l.click();
    l.remove();
  };
  const d = yap("div", "takvim");
  d.append(g, i);
  return d;
}

function ilgiPenceresi() {
  const secili = new Set(ilgiler || []);
  const perde = yap("div", "perde");
  const p = yap("div", "pencere");
  p.append(yap("h2", "", "Neleri seversin? ✨"), yap("p", "", "Seçtiğin alanlara göre sana özel bir akış hazırlayalım. İstediğin kadar seçebilirsin, sonra istediğin zaman değiştirebilirsin."));
  const kutu = yap("div", "secenekler");
  KATEGORILER.forEach(k => {
    const b = yap("button", secili.has(k) ? "secili" : "", (KATEGORI_SIMGE[k] || "") + " " + k);
    b.onclick = () => { if (secili.has(k)) secili.delete(k); else secili.add(k); b.classList.toggle("secili", secili.has(k)); };
    kutu.append(b);
  });
  const kapat = () => { perde.remove(); goster(); };
  const atla = yap("button", "ikincil", ilgiler ? "Vazgeç" : "Şimdilik geç");
  atla.onclick = () => { if (!ilgiler) { ilgiler = []; kaydet("ilgiler", ilgiler); } kapat(); };
  const tamam = yap("button", "ana-dugme", "Kaydet");
  tamam.onclick = () => { ilgiler = [...secili]; kaydet("ilgiler", ilgiler); if (ilgiler.length) sekme = "ozel"; kapat(); window.scrollTo(0, 0); };
  const dug = yap("div", "dugmeler");
  dug.append(atla, tamam);
  p.append(kutu, dug);
  perde.append(p);
  perde.onclick = e => { if (e.target === perde) atla.onclick(); };
  document.body.append(perde);
}

function benimMi(v) {
  return (ilgiler || []).includes(v.kategori) || favoriler.has(v.kanalId);
}

function oneriHazirla() {
  const ilgiVar = (ilgiler || []).length > 0;
  const uygun = v => !ilgiVar || benimMi(v);
  const karistir = l => [...l].sort(() => Math.random() - 0.5);
  const taze = akis.filter(v => v.durum === "none" && !shortsMu(v) && Date.now() - new Date(v.tarih) < 4 * 86400000);
  const havuz = karistir(taze.filter(uygun)).concat(karistir(taze.filter(v => !uygun(v))));
  const canli = akis.filter(v => v.durum === "live" && uygun(v));
  const secim = [], kanallar = new Set();
  if (canli.length) { const c = canli[Math.floor(Math.random() * canli.length)]; secim.push(c); kanallar.add(c.kanalId); }
  havuz.forEach(v => { if (secim.length < 3 && !kanallar.has(v.kanalId)) { secim.push(v); kanallar.add(v.kanalId); } });
  oneriSecim = secim;
}

function bolumBasligi(baslik, altYazi, dugmeYazi, dugmeIs) {
  const b = yap("div", "bolum");
  const sol = yap("div");
  sol.append(baslik);
  if (altYazi) { sol.append(yap("br")); sol.append(yap("span", "alt-yazi", altYazi)); }
  b.append(sol);
  if (dugmeYazi) { const d = yap("button", "", dugmeYazi); d.onclick = dugmeIs; b.append(d); }
  return b;
}

function gundemKart(o) {
  const tur = GUNDEM_TUR[o.tur] || ["📣", ""];
  const kutu = yap("div", "kart haber");
  const a = yap("a");
  a.href = o.tur === "basin" ? o.link : "https://www.youtube.com/watch?v=" + o.videoId;
  a.target = "_blank";
  a.rel = "noopener";
  let gorsel;
  if (o.resim) {
    gorsel = yap("img");
    gorsel.src = o.resim;
    gorsel.alt = "";
    gorsel.loading = "lazy";
    gorsel.referrerPolicy = "no-referrer";
    gorsel.onerror = () => gorsel.replaceWith(yap("div", "yer", tur[0]));
  } else {
    gorsel = yap("div", "yer", tur[0]);
  }
  const bilgi = yap("div", "bilgi");
  bilgi.append(yap("div", "baslik", o.metin));
  bilgi.append(yap("div", "kanal", tur[0] + " " + (o.tur === "basin" ? o.kaynak : tur[1]) + " · " + neZaman(o.tarih)));
  if (o.ozet) bilgi.append(yap("div", "ozet", o.ozet));
  a.append(gorsel, bilgi);
  kutu.append(a);
  return kutu;
}

function konulariKur() {
  const nav = document.getElementById("konular");
  nav.replaceChildren();
  GUNDEM_FILTRE.forEach(k => {
    const simge = Object.values(GUNDEM_TUR).find(t => t[1] === k);
    const b = yap("button", "", simge ? simge[0] + " " + k : k);
    b.dataset.konu = k;
    b.onclick = () => { secilenKonu = k; goster(); window.scrollTo(0, 0); };
    nav.append(b);
  });
}

function yaklasanlar() {
  const simdi = Date.now();
  return akis
    .filter(v => v.durum === "upcoming" && v.planlanan)
    .filter(v => { const t = new Date(v.planlanan).getTime(); return t > simdi - 2 * 3600000 && t < simdi + 7 * 86400000; })
    .sort((a, b) => new Date(a.planlanan) - new Date(b.planlanan));
}

function goster() {
  document.querySelectorAll("#sekmeler button").forEach(b => b.classList.toggle("aktif", b.dataset.sekme === sekme));
  document.querySelectorAll("#kategoriler button").forEach(b => b.classList.toggle("aktif", b.textContent === secilenKategori));
  document.getElementById("kategoriler").hidden = sekme !== "kategori";
  document.querySelectorAll("#konular button").forEach(b => b.classList.toggle("aktif", b.dataset.konu === secilenKonu));
  document.getElementById("konular").hidden = sekme !== "gundem";

  let videolar = [];
  let bosMesaj = "Burada şimdilik bir şey yok.";
  let shortsFiltresi = true;
  const kutuListe = document.getElementById("liste");

  if (sekme === "oneri") {
    kutuListe.replaceChildren(bolumBasligi("🎲 Bu akşam ne izlesem?", (ilgiler || []).length ? "İlgi alanlarına ve favorilerine göre seçildi" : "Son günlerin videolarından rastgele seçildi", "🔄 Başka öner", () => { oneriHazirla(); goster(); }));
    if (!oneriSecim.length) { kutuListe.append(yap("div", "bos", "Şu an önerecek video bulamadım. Biraz sonra tekrar dene!")); return; }
    oneriSecim.forEach(v => kutuListe.append(kart(v, false)));
    return;
  }
  if (sekme === "ozel") {
    if (!(ilgiler || []).length && !favoriler.size) {
      kutuListe.replaceChildren(bolumBasligi("✨ Sana özel", "Henüz ilgi alanı seçmedin", "İlgi alanlarını seç", ilgiPenceresi));
      kutuListe.append(yap("div", "bos", "Sevdiğin konuları seç, bu sayfa sadece onlarla dolsun."));
      return;
    }
    const aranirsa = v => !aranan || (v.baslik + " " + v.kanal).toLocaleLowerCase("tr").includes(aranan);
    const yakinda = yaklasanlar().filter(v => benimMi(v) && aranirsa(v) && new Date(v.planlanan) - Date.now() < 86400000);
    const sayac = {};
    const akisim = akis
      .filter(v => benimMi(v) && v.durum !== "upcoming" && !(shortsGizle && shortsMu(v)) && aranirsa(v))
      .sort((a, b) => (b.durum === "live") - (a.durum === "live") || new Date(b.tarih) - new Date(a.tarih))
      .filter(v => (sayac[v.kanalId] = (sayac[v.kanalId] || 0) + 1) <= 2)
      .slice(0, 60);
    kutuListe.replaceChildren(bolumBasligi("✨ Sana özel", (ilgiler || []).join(", ") || "Favori kanalların", "İlgi alanlarını düzenle", ilgiPenceresi));
    if (yakinda.length) {
      kutuListe.append(bolumBasligi("📅 Önümüzdeki 24 saatte", "Hatırlatma için takvimine ekleyebilirsin"));
      yakinda.forEach(v => kutuListe.append(kart(v, false)));
      kutuListe.append(bolumBasligi("🎬 Senin için son videolar"));
    }
    if (!akisim.length) { kutuListe.append(yap("div", "bos", "Seçtiğin alanlarda şu an video yok.")); return; }
    akisim.forEach(v => kutuListe.append(kart(v, false)));
    return;
  }

  if (sekme === "trend") {
    videolar = trend;
  } else if (sekme === "canli") {
    videolar = akis.filter(v => v.durum === "live").sort((a, b) => b.izleyen - a.izleyen);
    bosMesaj = "Şu an listedeki kanallarda canlı yayın yok. Biraz sonra tekrar bak!";
    shortsFiltresi = false;
  } else if (sekme === "yaklasan") {
    videolar = yaklasanlar();
    bosMesaj = "Listedeki kanalların önümüzdeki günler için planlanmış yayını yok.";
    shortsFiltresi = false;
  } else if (sekme === "yeni") {
    const sayac = {};
    videolar = akis
      .filter(v => v.durum === "none" && !(shortsGizle && shortsMu(v)))
      .filter(v => (sayac[v.kanalId] = (sayac[v.kanalId] || 0) + 1) <= 2)
      .slice(0, 60);
  } else if (sekme === "gundem") {
    let liste = gundem.filter(o => secilenKonu === "Tümü" || (GUNDEM_TUR[o.tur] || [])[1] === secilenKonu);
    if (aranan) liste = liste.filter(o => (o.metin + " " + (o.kanal || "") + " " + (o.kaynak || "")).toLocaleLowerCase("tr").includes(aranan));
    const kutu = document.getElementById("liste");
    kutu.replaceChildren();
    if (!liste.length) {
      kutu.append(yap("div", "bos", aranan ? "“" + arananHam + "” için gündemde bir şey bulunamadı." : "Gündem birikiyor. Veriler her 30 dakikada güncellendikçe burası dolacak."));
      return;
    }
    liste.slice(0, 150).forEach(o => kutu.append(gundemKart(o)));
    return;
  } else if (sekme === "favori") {
    const gorulen = new Set();
    videolar = akis.concat(trend)
      .filter(v => favoriler.has(v.kanalId) && v.durum !== "upcoming" && !gorulen.has(v.id) && gorulen.add(v.id))
      .sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
    bosMesaj = favoriler.size
      ? "Favori kanallarının şu an listede videosu yok."
      : "Henüz favori kanalın yok. Kartlardaki ☆ işaretine dokunarak kanal ekleyebilirsin.";
  } else {
    videolar = akis.filter(v => v.kategori === secilenKategori && v.durum !== "upcoming").sort((a, b) => (b.durum === "live") - (a.durum === "live") || b.izlenme - a.izlenme);
  }

  if (shortsFiltresi && shortsGizle) videolar = videolar.filter(v => !shortsMu(v));
  if (aranan) {
    videolar = videolar.filter(v => (v.baslik + " " + v.kanal).toLocaleLowerCase("tr").includes(aranan));
    bosMesaj = "“" + arananHam + "” için bu sekmede sonuç yok.";
  }

  const liste = document.getElementById("liste");
  liste.replaceChildren();
  if (!videolar.length) {
    liste.append(yap("div", "bos", bosMesaj));
    return;
  }
  videolar.forEach(v => liste.append(kart(v, sekme === "trend")));
}

function ustBilgiGuncelle() {
  if (guncellemeZamani) document.getElementById("guncelleme").textContent = "Son güncelleme: " + neZaman(guncellemeZamani);
  const canli = akis.filter(v => v.durum === "live").length;
  document.getElementById("canliButon").textContent = "🔴 Canlı" + (canli ? " (" + canli + ")" : "");
  const yaklasan = yaklasanlar().length;
  document.getElementById("yaklasanButon").textContent = "📅 Yaklaşan" + (yaklasan ? " (" + yaklasan + ")" : "");
}

function yukle() {
  const taze = "?" + Date.now();
  return Promise.all([
    fetch("data/trend.json" + taze).then(r => r.json()),
    fetch("data/akis.json" + taze).then(r => r.json()),
    fetch("data/gundem.json" + taze).then(r => r.json()).catch(() => ({ olaylar: [] })),
    fetch("data/haberler.json" + taze).then(r => r.json()).catch(() => ({ haberler: [] }))
  ]).then(([t, a, g, h]) => {
    trend = t.videolar.map((v, i) => Object.assign(v, { sira: i + 1 }));
    akis = a.videolar;
    const basin = (h.haberler || []).map(x => ({ tur: "basin", metin: x.baslik, ozet: x.ozet, link: x.link, kaynak: x.kaynak, resim: x.resim, tarih: x.tarih }));
    gundem = (g.olaylar || []).concat(basin).sort((x, y) => new Date(y.tarih) - new Date(x.tarih));
    guncellemeZamani = a.guncelleme;
    sonYukleme = Date.now();
    ustBilgiGuncelle();
    goster();
  }).catch(() => {
    if (!sonYukleme) document.getElementById("guncelleme").textContent = "Veri yüklenemedi.";
  });
}

document.querySelectorAll("#sekmeler button").forEach(b => {
  b.onclick = () => { sekme = b.dataset.sekme; goster(); window.scrollTo(0, 0); };
});
konulariKur();
document.getElementById("zarButon").onclick = () => { sekme = "oneri"; oneriHazirla(); goster(); window.scrollTo(0, 0); };
KATEGORILER.forEach(k => {
  const b = yap("button", "", k);
  b.onclick = () => { secilenKategori = k; goster(); };
  document.getElementById("kategoriler").append(b);
});
document.getElementById("arama").oninput = e => {
  arananHam = e.target.value.trim();
  aranan = arananHam.toLocaleLowerCase("tr");
  goster();
};
const shortsKutusu = document.getElementById("shorts");
shortsKutusu.checked = shortsGizle;
shortsKutusu.onchange = () => {
  shortsGizle = shortsKutusu.checked;
  kaydet("shortsGizle", shortsGizle);
  goster();
};

yukle();
if (ilgiler === null) ilgiPenceresi();
setInterval(() => { if (document.visibilityState === "visible") yukle(); }, BES_DK);
setInterval(ustBilgiGuncelle, 60000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - sonYukleme > BES_DK) yukle();
});
</script>
